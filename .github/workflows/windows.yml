name: Windows build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Dev-Orbit-Windows
          path: dist/*.exe
