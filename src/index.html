<!doctype html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:"><title>Dev Orbit</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tray.css"><link rel="stylesheet" href="discovery.css"><link rel="stylesheet" href="activity.css"></head>
<body><div class="tray-header"><a class="brand"><span class="planet">◉</span> Dev Orbit</a><div><button id="refresh" title="Erkennung aktualisieren">↻</button><button id="hidePanel" title="Fenster schließen">✕</button></div></div><nav><button data-view="overview" class="nav active">Projekte</button><button data-view="activity" class="nav">Aktivität</button><button data-view="processes" class="nav">Prozesse</button><button data-view="settings" class="nav">⚙</button></nav><div id="projectNav" hidden></div><button id="addProjectSmall" hidden>+</button>
<main><header><div><h1 id="heading">Deine Projekte</h1><p id="subtitle">Projekt aufklappen, Services steuern.</p></div><button id="addProject" class="primary" title="Projekt hinzufügen">+</button></header><div id="error" hidden></div><div id="content"></div></main><footer><span id="scanTime">Windows-Erkennung wird gestartet …</span></footer>
<dialog id="editor"><form id="editForm"><div class="modal-head"><h2 id="modalTitle"></h2><button type="button" id="closeModal">✕</button></div><div id="fields"></div><p id="formError" class="error"></p><div class="modal-actions"><button type="button" id="cancelModal">Abbrechen</button><button type="submit" class="primary">Speichern</button></div></form></dialog>
<dialog id="logsModal"><div class="modal-head"><h2 id="logsTitle">Service-Logs</h2><button id="closeLogs">✕</button></div><pre id="logsText"></pre><button id="refreshLogs">↻ Logs aktualisieren</button></dialog><div id="toast" hidden></div><script src="renderer.js"></script></body></html>
